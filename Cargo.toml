[package]
name = "tmm-materials"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Materials library for the TMM ecosystem"
license = "MIT"

[lib]
name = "tmm_materials"
path = "src/lib.rs"


[dependencies]
ndarray = "0.17.2"
num-complex = "0.4.6"
num-traits = "0.2.19"
thiserror = "2.0.18"
tmm-core = { path = "../tmm_core" }

[dev-dependencies]
approx = "0.5.1"
ndarray = "0.17.2"
num-complex = "0.4.6"

[profile.dev]
debug = true

[profile.release]
codegen-units = 1
lto = "thin"

[workspace.metadata.release]
tag = true
push = true
publish = true
sign-commit = false
